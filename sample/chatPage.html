<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure WS Tester</title>
  <style>
      /* Basic Dark Theme Styling */
      body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-color: #121212;
          color: #e0e0e0;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 2rem;
      }

      .container {
          width: 100%;
          max-width: 600px;
          background: #1e1e1e;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }

      #log {
          height: 300px;
          overflow-y: auto;
          background: #000;
          padding: 10px;
          margin-top: 10px;
          border-radius: 4px;
          font-family: 'Courier New', Courier, monospace;
          font-size: 0.9rem;
          border: 1px solid #333;
      }

      .entry { margin-bottom: 5px; }
      .server { color: #4caf50; } /* Green for incoming */
      .client { color: #2196f3; } /* Blue for outgoing */

      input {
          width: calc(100% - 22px);
          padding: 10px;
          margin-top: 10px;
          background: #2d2d2d;
          border: 1px solid #444;
          color: white;
          border-radius: 4px;
      }

      button {
          margin-top: 10px;
          width: 100%;
          padding: 10px;
          background-color: #007bff;
          border: none;
          color: white;
          font-weight: bold;
          cursor: pointer;
          border-radius: 4px;
      }

      button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

<div class="container">
  <h2>TEEJAY WebSocket Debugger</h2>
  <div id="status">Status: Disconnected ❌</div>
  <input type="text" id="nameInput" placeholder="Enter your Username"/>
  <div id="log"></div>

  <input type="text" id="messageInput" placeholder="Type a message...">
  <button id="sendBtn">Send Broadcast</button>
</div>

<script>
  // DOM Elements
  const log = document.getElementById('log');
  const username = document.getElementById('nameInput');
  const input = document.getElementById('messageInput');
  const btn = document.getElementById('sendBtn');
  const status = document.getElementById('status');

  // Helper to append to our "UI Console"
  function addLog(text, type) {
    const div = document.createElement('div');
    div.className = `entry ${type}`;
    div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight; // Auto-scroll
  }

  // 1. Connection Logic
  const socket = new WebSocket("ws://localhost:8080");

  socket.addEventListener("open", () => {
        status.textContent = "Status: Connected ✅";
        status.style.color = "#4caf50";
        addLog("Connected to Server", "server");
      }
  )

  socket.addEventListener("message", (event) => {
        // event.data is the raw string from the server
        addLog(`${event.data}`, "server");
      }
  )

  socket.addEventListener ("close", () => {
        status.textContent = "Status: Disconnected ❌";
        status.style.color = "#f44336";
      }
  );

  // 2. Action Logic
  btn.onclick = () => {
    const val = input.value;
    const name = username.value;
    if (!val || !name || socket.readyState !== WebSocket.OPEN) {
      return alert("Please make sure you're connected and that you enter your username and some text")
    }
    socket.send(`${name}: ${val}`);
    addLog(`Me: ${val}`, "client");
    input.value = "";
  };

  // Enter key support
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") btn.click();
  });
</script>
</body>
</html>
